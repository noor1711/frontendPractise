<!DOCTYPE html>
<html lang="en-US">

<head>
    <style>
        .highlight {
            color: white;
            background-color: black;
            padding: 10px;
            width: 250px;
            text-align: center;
        }
    </style>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple DOM example</title>
</head>

<body>
    <section>
        <img src="./dinosaur.png"
            alt="A red Tyrannosaurus Rex: A two legged dinosaur standing upright like a human, with small arms, and a large head with lots of sharp teeth.">
        <p>Here we will add a link to the <a href="https://www.mozilla.org/">Mozilla homepage</a></p>
        <button>Hello hero</button>
    </section>
    <script>

        const sleep = async () => await new Promise(r => setTimeout(r, 3000))
        sleep().then(() => {
            let link = document.querySelector("a")
            link.textContent = "foo shoo"
            link.href = "https://www.pins2things.com"

            let sect = document.querySelector("section")
            let para = document.createElement("p")
            para.textContent = "Hey mfs"
            sect.appendChild(para)
            
            let txt = document.createTextNode("hey mfs in txt")
            sect.appendChild(txt)
            sect.appendChild(para)
            para.classList.add("highlight")
        })
        
    </script>
</body>

</html>
