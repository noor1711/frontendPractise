    <script>
        
        const getName = (el) => {
            return el.id ? `${el.tagName.toLowerCase()}#${el.id}` :
                            el.className ? `${el.tagName.toLowerCase()}.${el.className.split(" ").join(".")}` :
                                            el.tagName.toLowerCase()
        }

        const getPath = (el, stopAt=document.body) => {
            let curr = el
            let ans = []
            while (curr != stopAt) {
                console.log(curr)
                ans.push(getName(curr))

            }
