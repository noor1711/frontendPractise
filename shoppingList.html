<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list example</title>
    <style>
        li {
            margin-bottom: 10px;
        }

        li button {
            font-size: 12px;
            margin-left: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <h1>My shopping list</h1>

    <form>
        <label for="item">Enter a new item:</label>
        <input type="text" name="item" id="item">
        <button>Add item</button>
    </form>

    <ul>

    </ul>

    <script>
        const ul = document.querySelector("ul")
        const input = document.querySelector("input")
        const button = document.querySelector("button")
        
        const createListItem = (listRef, text) => {
            const item = document.createElement("li")
            const span = document.createElement("span")
            const butt = document.createElement("button")

            
            span.textContent = text
            butt.textContent = "Delete"
            
            item.appendChild(span)
            item.appendChild(butt)

            butt.addEventListener("click", (ev) => {
                ev.preventDefault()
                item.remove()
            })

            listRef.appendChild(item)
        }

        const clickHandler = (ev) => {
            ev.preventDefault()
            console.log(input.value)
            createListItem(ul, input.value)
            input.value = ""
            input.focus()
        }
        
        button.addEventListener("keydown", clickHandler)
        

    </script>
</body>

</html>
