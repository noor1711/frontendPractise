<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list example</title>
    <style>
        li {
            margin-bottom: 10px;
        }

        li button {
            font-size: 12px;
            margin-left: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <h1>My shopping list</h1>

    <form>
        <label for="item">Enter a new item:</label>
        <input type="text" name="item" id="item">
        <button>Add item</button>
    </form>

    <ul>

    </ul>

    <script>

        const ul = document.querySelector("ul")
        const input = document.querySelector("input")
        const button = document.querySelector("button")
        
        ul.addEventListener("click", (ev) => {
            const target = ev.target;

            if (target.matches("button.delete")) {
                const item = target.closest("li")
                const text = item.querySelector("span").textContent
                localStorage.removeItem(text)
                item.remove()
            } else if (target.matches("button.up")) {
                const item = target.closest("li")
                const prev = item.previousElementSibling;
                item.parentElement.insertBefore(item, prev)
            }

        }) 

        const createListItem = (listRef, text) => {
            const item = document.createElement("li")
            const span = document.createElement("span")
            const butt = document.createElement("button")
            butt.classList.add("delete")

            const moveUpButton = document.createElement("button")
            moveUpButton.classList.add("up")
            
            span.textContent = text
            butt.textContent = "Delete"
            moveUpButton.textContent = "Up"
            
            localStorage.setItem(text, localStorage.getItem(text) || 0) // instead of creating a new key, better to use domain as key and store all values in a list
            item.appendChild(span)
            item.appendChild(butt)
            item.appendChild(moveUpButton)
            listRef.appendChild(item)
        }

        const loadFromLocalStorage = () => {
            Object.keys(localStorage)?.forEach(element => {
                createListItem(ul, element)
            });
        }

        const clickHandler = (ev) => {
            ev.preventDefault()
            console.log(input.value)
            createListItem(ul, input.value)
            input.value = ""
            input.focus()
        }
        
        button.addEventListener("click", clickHandler)
        loadFromLocalStorage()

    </script>
</body>

</html>
